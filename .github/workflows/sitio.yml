# Publica el sitio (carpeta sitio/) en GitHub Pages cada vez que cambia en main.
# Requisito, una sola vez: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Dirección: https://diegosimemirror.github.io/tarea4/
name: Sitio web

on:
  push:
    branches: [main]
    paths:
      - "sitio/**"
      - ".github/workflows/sitio.yml"
  workflow_dispatch:        # permite publicarlo a mano desde la pestaña Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4
